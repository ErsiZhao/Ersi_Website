  <style>
    :root {
      --aspect-ratio: 1;
      --button-color: rgba(199, 158, 53, 0.19);
      --overlay-bg-color: 0, 0, 0;
      --overlay-opacity: 0;
      --image-gap: 0rem;
      --parallax-factor: 0.2;
      --title-font-size: 2rem;
      --description-font-size: 1rem;
      --visible-image-height: 500px;
      --base-visible-height: 400;
      --base-title-size: 2; /* rem */
      --base-description-size: 1; /* rem */

      /* Bottom stack geometry. The horizontal-navigation group (indicator,
         swipe cue, title) is offset from a single --nav-bottom so the three
         move together as one unit; the vertical cue sits on its own well
         below, so the two groups read as separate. */
      --nav-bottom: 8rem;
      --caption-gap: 2rem;
      --scroll-cue-bottom: 2.8rem;
    }

    /* Touch: lift everything clear of the mobile browser bar and the home
       indicator, and leave room for the swipe cue between title and segments. */
    @media (hover: none) and (pointer: coarse) {
      :root {
        --nav-bottom: calc(env(safe-area-inset-bottom, 0px) + 9.5rem);
        --caption-gap: 4rem;
        --scroll-cue-bottom: calc(env(safe-area-inset-bottom, 0px) + 3.2rem);
      }
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;

      /* menu.css gives every page a fixed, cover-sized photo background. On this
         page it is completely hidden behind the carousel and the gallery, but it
         still downloads and — because it is background-attachment: fixed — forces
         a full-viewport repaint on every scroll frame, which is what makes
         scrolling stutter on desktop. Cancel it here only; other pages keep it. */
      background-image: none;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
        /*opacity and transition are fix BG image loading before the reel page*/
        opacity: 0;
        transition: opacity 0.4s ease;
    }



    .gallery-item {
      position: relative;
      width: 100vw;
      max-width: 100%;
      height: var(--visible-image-height);
      overflow: hidden;
    }

    .gallery-item img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.05s linear;
      will-change: transform;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background-color: rgba(var(--overlay-bg-color), var(--overlay-opacity));
      padding: 1rem;
      border-radius: 10px;
    }

    .overlay h2 {
      margin: 0 0 0.5rem 0;
      font-size: var(--title-font-size);
    }

    .overlay p {
      font-size: var(--description-font-size);
    }

    .overlay a {
      display: inline-block;
      padding: 0.5rem 1rem;
      background-color: var(--button-color);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 1rem;
    }

    /* Responsive tweak for vertical screens */
    @media (max-aspect-ratio: 3/4) {
      :root {
        --image-height: 75vh;
        --aspect-ratio: 0.6;
        --title-font-size: 2.2rem;
        --description-font-size: 1.2rem;
      }
    }

    /* prevent scrolling while menu or reel modal is visible */
    html.menu-open, body.menu-open,
    html.modal-open, body.modal-open { overflow: hidden; }

   /* ── Carousel ── */
  /* ── Carousel ── */
    .carousel {
      position: relative;
      width: 100vw;
      /* 100vh on mobile is the viewport as if the browser toolbar were hidden,
         so anything anchored to the bottom ends up behind Chrome's/Safari's bar
         on first load. dvh tracks the actually-visible height and follows the
         bar as it hides and shows. vh stays as the fallback for old browsers. */
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      flex-shrink: 0;
    }

  body.site-ready .carousel { opacity: 1; }

  .slides-wrapper {
    display: flex;
    height: 100vh;
    height: 100dvh;
    transition: transform 0.65s cubic-bezier(0.77, 0, 0.175, 1);
    will-change: transform;
  }

  .slide {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }


    /* The bottom stack, measured up from the safe area:
         scroll cue  ->  indicator  ->  swipe cue (touch)  ->  title
       Touch gets taller offsets so nothing sits under the mobile browser bar
       while it is showing on first load. */
    .slide-caption {
      position: absolute;
      bottom: calc(var(--nav-bottom) + var(--caption-gap));
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
    }






    .slide-title {
      color: white;
      font-size: clamp(2.5rem, 10vw, 8rem);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
      white-space: nowrap;
      display: block;
    }

    .slide-subtitle {
      color: rgba(255,255,255,0.7);
      font-size: clamp(0.7rem, 1.5vw, 0.95rem);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: 0.5rem;
      white-space: nowrap;
      display: block;
    }



  /* Slide order: 0 Eras Tour · 1 Reel · 2 NF Clouds · 3 Spotify */

  /* Poster matches the hero video's own first frame, so the handoff is invisible */
  .slide-era     { background: #000 url('images/era_hero_poster.jpg') center/cover no-repeat; }
  .slide-reel    { background: url('images/landing_hero.jpg') center/cover no-repeat; cursor: pointer; }
  .slide-clouds  { background: url('images/7_clouds.png') center/cover no-repeat; }
  .slide-spotify { background: url('images/4_spotify_v03.png') center/cover no-repeat; }

  /* Self-hosted silent loop. A native <video> has no player chrome at all, so
     there is nothing to hide and no player bootstrap to wait through — which is
     what the poster-hold and reveal-timing code existed to work around.
     object-fit lets us size to the slide directly instead of the 16:9 overscan
     the YouTube iframe needed. */
  .slide-video {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    object-fit: cover;
    border: none;
    pointer-events: none;
    display: block;
  }


  /* ── Arrows ── */
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: white;
    font-size: 4rem;
    cursor: pointer;
    z-index: 500;
    padding: 1rem 1.5rem;
    opacity: 0.55;
    transition: opacity 0.2s, transform 0.2s;
    user-select: none;
    line-height: 1;
  }

  .arrow:hover { opacity: 1; transform: translateY(-50%) scale(1.15); }
  .arrow-left  { left: 1rem; }
  .arrow-right { right: 1rem; }
  .arrow.hidden { visibility: hidden; pointer-events: none; }

  /* On phones/tablets the slides are driven by swipe instead */
  @media (hover: none) and (pointer: coarse) {
    .arrow { display: none; }
  }

  /* ── Slide indicator (horizontal position) ──
     Segments rather than circles: a row of bars along a track reads as
     "position in a sequence", which is what horizontal paging is. The active
     one widens and takes the site's gold accent. */
  .dots {
    position: absolute;
    bottom: var(--nav-bottom);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 0.75rem;
    z-index: 500;
  }

  /* All segments the same size — only colour marks the active one, so nothing
     grows into a block. The element IS the visible bar: its box is exactly
     34x3 and the finger-sized hit area comes from a transparent ::after.
     Padding would risk the fill painting across the whole padded box. */
  .dot {
    position: relative;
    width: 34px;
    height: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.28);
    cursor: pointer;
    transition: background 0.35s ease;
  }

  .dot.active { background: rgba(199,158,53,0.95); }

  .dot::after {
    content: '';
    position: absolute;
    inset: -16px -7px;   /* invisible, just the tap target */
  }

  /* ── Horizontal cue ──
     Only shown where the arrows are hidden, i.e. touch devices. */
  /* Sits between the segments and the title — grouped with them, since all
     three describe horizontal movement. */
  .swipe-hint {
    position: absolute;
    bottom: calc(var(--nav-bottom) + 2rem);
    left: 50%;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    gap: 0.55rem;
    color: rgba(255,255,255,0.75);
    font-size: 0.62rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    z-index: 500;
    pointer-events: none;
  }

  @media (hover: none) and (pointer: coarse) {
    .swipe-hint { display: flex; }
  }

  .swipe-hint .nudge-l { animation: nudgeLeft  1.9s ease-in-out infinite; }
  .swipe-hint .nudge-r { animation: nudgeRight 1.9s ease-in-out infinite; }

  @keyframes nudgeLeft {
    0%, 100% { transform: translateX(0);    opacity: 0.5; }
    50%      { transform: translateX(-4px); opacity: 1; }
  }

  @keyframes nudgeRight {
    0%, 100% { transform: translateX(0);   opacity: 0.5; }
    50%      { transform: translateX(4px); opacity: 1; }
  }



  /* ── Video modal ── */
  #videoModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.96);
    z-index: 3000;
  }

  #videoModal.open { display: block; }

  /* Self-hosted reel. A native <video> has no chrome to clip or out-time, and
     object-fit handles every aspect ratio, so none of the iframe geometry
     (bleed, overscan, min/max sizing) is needed any more. */
  #reelVideoWrap {
    position: absolute;
    inset: 0;
  }

  #reelVideo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 100%;
    object-fit: contain;   /* letterbox, never crop the frame */
    background: #000;
    display: block;
  }

  #modalClose {
    position: absolute;
    /* Safe-area inset keeps this clear of the iPhone notch / status bar */
    top: calc(env(safe-area-inset-top, 0px) + 1rem);
    right: calc(env(safe-area-inset-right, 0px) + 1rem);
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: rgba(0,0,0,0.35);
    border: none;
    color: white;
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
    z-index: 3003;   /* above the click-catcher (3001) and scrub bar (3002) */
    opacity: 0.75;
    transition: opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  #modalClose:hover { opacity: 1; }

  /* ── Custom reel controls ──
     YouTube's control bar cannot be partially hidden — controls:1 brings the
     logo, title, share and settings with it, controls:0 removes everything.
     So the player runs bare and we draw just the scrub bar ourselves. */

  /* Keep clicks off the iframe; with controls:0 YouTube would still toggle
     playback on click and fight our own handler. */
  #reelVideoWrap { pointer-events: none; }

  #reelClickCatch {
    position: absolute;
    inset: 0;
    z-index: 3001;
    /* No cursor of its own on purpose: cursor is inherited, so an explicit
       value here would defeat the modal's cursor: none auto-hide. */
  }

  .reel-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3002;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px calc(env(safe-area-inset-right, 0px) + 20px)
             calc(env(safe-area-inset-bottom, 0px) + 16px)
             calc(env(safe-area-inset-left, 0px) + 20px);
    background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
    transition: opacity 0.3s ease;
  }

  /* Fades out with the cursor, returns on any move or tap */
  .reel-bar.idle { opacity: 0; pointer-events: none; }

  .reel-track {
    position: relative;
    flex: 1;
    height: 34px;          /* generous hit area; the rail itself stays thin */
    cursor: pointer;
    touch-action: none;
  }

  .reel-rail, .reel-fill {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 4px;
    border-radius: 2px;
  }

  .reel-rail {
    left: 0;
    right: 0;
    background: rgba(255,255,255,0.28);
  }

  .reel-fill {
    left: 0;
    width: 0;
    background: rgba(199,158,53,0.95);   /* site accent */
  }

  .reel-fill::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .reel-time {
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  @media (max-width: 600px) {
    .reel-time { font-size: 11px; }
    .reel-bar  { gap: 10px; }
  }

  .reel-fs {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border: none;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.9);
    cursor: pointer;
    transition: background 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  .reel-fs:hover { background: rgba(255,255,255,0.18); }

  /* The rotate-and-fill fallback is gone: a self-hosted <video> can enter real
     fullscreen on iPhone via webkitEnterFullscreen(), which hands off to the
     system player and actually hides the browser bars. The CSS workaround only
     ever produced a full-bleed layout underneath Safari's chrome. */
  #reelStage {
    position: absolute;
    inset: 0;
  }



   /* ── Vertical cue ──
      The gallery below the hero was previously undiscoverable: the old hint was
      a 0.5rem empty label at 60% opacity. Now it carries a real caption and
      enough contrast to be read against any slide. */
  .scroll-hint {
    position: absolute;
    bottom: var(--scroll-cue-bottom);
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    z-index: 500;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
    color: rgba(255,255,255,0.85);
  }

  .scroll-hint.visible { opacity: 1; }

  .scroll-hint span {
    font-size: 0.64rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
    text-shadow: 0 1px 6px rgba(0,0,0,0.85);
  }

  .scroll-hint svg {
    animation: scrollBounce 1.5s ease-in-out infinite;
  }

  @keyframes scrollBounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(6px); }
  }

  /* Play icon for the demo reel — centred now that the "Reel" title is gone */
  .play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 5rem;
    height: 5rem;
    opacity: 0.8;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 10;
  }

  .slide-reel:hover .play-icon {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.1);
  }
  </style>

</head>

  <!-- Video modal (Reel) -->

    <div id="reelStage">
      <div id="reelVideoWrap">

               playsinline preload="metadata"></video>
      </div>
      <!-- Tap/click target for pause-resume, so clicks never reach the iframe -->
      <div id="reelClickCatch"></div>
      <div class="reel-bar" id="reelBar">
        <div class="reel-track" id="reelTrack">
          <div class="reel-rail"></div>
          <div class="reel-fill" id="reelFill"></div>
        </div>
        <span class="reel-time" id="reelTime">0:00 / 0:00</span>
        <button class="reel-fs" id="reelFs" aria-label="Fullscreen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
          </svg>
        </button>
      </div>
    </div>
  </div>







  <!-- Gallery -->
  <main class="gallery" id="gallery"></main>




  <script>
    // ---------- readiness gate ----------
    let galleryReadyResolve;
    const galleryReady = new Promise((resolve) => (galleryReadyResolve = resolve));

    // ---------- Build gallery from JSON ----------
    fetch('projects.json')
      .then(r => r.json())
      .then(async (data) => {
        const gallery = document.getElementById('gallery');

        data.forEach((project) => {
          const item = document.createElement('div');
          item.className = 'gallery-item';

          const img = document.createElement('img');
          img.src = project.image;
          img.alt = project.title;
          img.dataset.offset = project.offset || 0;

          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          overlay.innerHTML = `
            <h2>${project.title}</h2>
            <p style="margin: 0.5rem 0 1rem 0; font-size: var(--description-font-size); color: #ccc;">
              ${project.description || ''}
            </p>
            <a href="${project.youtube}" target="_blank" rel="noopener noreferrer">${project.buttonText}</a>
          `;
          item.appendChild(img);
          item.appendChild(overlay);
          gallery.appendChild(item);
        });

        // Wait until images are decodable/paintable
        const imgs = [...document.querySelectorAll('.gallery-item img')];
        await Promise.all(
          imgs.map((img) =>
            (img.decode ? img.decode() : Promise.resolve()).catch(() => {
              return new Promise((res) => {
                if (img.complete) return res();
                img.addEventListener('load', res, { once: true });
                img.addEventListener('error', res, { once: true });
              });
            })
          )
        );


        updateLayoutSizes();
        applyParallax();
        // That way the gallery is invisible during the load/decode phase and fades in cleanly once everything is sized correctly.
        document.getElementById('gallery').style.opacity = '1';  // ← add this line




        galleryReadyResolve();
      })
      .catch(err => {
        console.error('Failed to load projects.json', err);
        galleryReadyResolve();
      });





    // ---------- Parallax ----------
    let ticking = false;
    const parallaxFactor = 0.2;

    function applyParallax() {
      const images = document.querySelectorAll('.gallery-item img');
      const windowHeight = window.innerHeight;

      images.forEach((img) => {
        const item = img.closest('.gallery-item');
        const rect = item.getBoundingClientRect();
        const center = rect.top + rect.height / 2 - windowHeight / 2;
        const offset = parseFloat(img.dataset.offset || 0);
        img.style.transform = `translate(-50%, calc(-50% + ${offset + center * -parallaxFactor}px))`;
      });

      ticking = false;
    }
    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(applyParallax);
        ticking = true;
      }
    });





    // ---------- Responsive sizing ----------
    function updateLayoutSizes() {
      const aspect = window.innerWidth / window.innerHeight;

      const baseTitle = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--base-title-size'));
      const baseDesc  = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--base-description-size'));
      const fontScale = aspect / 1.7;

      document.documentElement.style.setProperty('--title-font-size', `${baseTitle * fontScale}rem`);
      document.documentElement.style.setProperty('--description-font-size', `${baseDesc * fontScale}rem`);

      const baseVisibleHeight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--base-visible-height'));
      const heightScale = aspect / 1.7;
      document.documentElement.style.setProperty('--visible-image-height', `${baseVisibleHeight * heightScale}px`);
    }

    window.addEventListener('resize', () => {
      updateLayoutSizes();
      applyParallax();
    });
    window.addEventListener('load', () => {
      updateLayoutSizes();
      applyParallax();
    });





    // ---------- Intro control (video) ---------- start
    // (() => {
    //   const intro = document.getElementById('intro');
    //   const video = document.getElementById('introVideo');
    //
    //   const INTRO_MIN_MS = 1200;  // don't cut instantly
    //   const INTRO_MAX_MS = 10000; // safety
    //
    //   document.documentElement.classList.add('intro-lock');
    //   document.body.classList.add('intro-lock');
    //
    //   let endedResolve;
    //   const videoEnded = new Promise((resolve) => (endedResolve = resolve));
    //
    //   // Resolve when video ends OR fails
    //   video.addEventListener('ended', () => endedResolve(), { once: true });
    //   video.addEventListener('error', () => endedResolve(), { once: true });
    //
    //   // In some browsers autoplay might be blocked; try play() safely
    //   video.play().catch(() => {
    //     // still allow flow; user can click to skip
    //   });
    //
    //   function hideIntro() {
    //     // Crossfade: show site first
    //     document.body.classList.add('site-ready');
    //
    //     // next frame(s): fade intro out
    //     requestAnimationFrame(() => {
    //       requestAnimationFrame(() => {
    //         intro.classList.add('intro-hide');
    //
    //         document.documentElement.classList.remove('intro-lock');
    //         document.body.classList.remove('intro-lock');
    //
    //         setTimeout(() => intro.remove(), 900);
    //       });
    //     });
    //   }
    //
    //   const minDelay = new Promise(res => setTimeout(res, INTRO_MIN_MS));
    //   const maxDelay = new Promise(res => setTimeout(res, INTRO_MAX_MS));
    //
    //   // Hide when: (min time + gallery ready + video ended) OR max timeout
    //   Promise.race([
    //     Promise.all([minDelay, galleryReady, videoEnded]),
    //     maxDelay
    //   ]).then(hideIntro);
    //
    //   // Optional: click to skip
    //   intro.addEventListener('click', hideIntro);
    // })();
// ---------- Intro control (video) ---------end












 // ---------- Carousel + Reel modal ----------
  // Both videos run through the YouTube IFrame Player API rather than a plain
  // <iframe src>. Two reasons, both iOS:
  //   1. playsinline stops Safari handing playback off to the YouTube app.
  //   2. A pre-built player lets us call playVideo() inside the tap handler,
  //      so the gesture still counts and iOS doesn't demand a second tap.
  (() => {
    const carousel   = document.getElementById('carousel');
    const wrapper    = document.getElementById('slidesWrapper');
    const btnLeft    = document.getElementById('arrowLeft');
    const btnRight   = document.getElementById('arrowRight');
    const dotsEl     = document.getElementById('dots');
    const slideReel  = document.getElementById('slideReel');
    const modal      = document.getElementById('videoModal');
    const modalClose = document.getElementById('modalClose');

    const TOTAL   = 4;

    let current = 0;

    // ---------- Slide navigation ----------
    for (let i = 0; i < TOTAL; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    }

    function goTo(n) {
      if (n < 0 || n >= TOTAL) return;
      current = n;
      wrapper.style.transform = `translateX(-${current * 100}vw)`;
      btnLeft.classList.toggle('hidden', current === 0);
      btnRight.classList.toggle('hidden', current === TOTAL - 1);
      document.querySelectorAll('.dot').forEach((d, i) =>
        d.classList.toggle('active', i === current)
      );

      // Deliberately NOT pausing the background video when you swipe away.
      // A paused YouTube player draws its centre play button, so pausing on
      // leave means that button is sitting there waiting the moment you swipe
      // back. It is muted and loops, so letting it run is both simpler and the
      // only way to guarantee the slide is never re-entered showing chrome.
    }

    btnLeft.addEventListener('click',  () => goTo(current - 1));
    btnRight.addEventListener('click', () => goTo(current + 1));

    document.addEventListener('keydown', (e) => {
      if (modal.classList.contains('open')) {
        if (e.key === 'Escape') closeModal();
        if (e.key === ' ') {
          e.preventDefault();
          if (reelVideo.paused) reelVideo.play().catch(() => {});
          else                  reelVideo.pause();
          resetCursorTimer();
        }
        return;
      }
      if (e.key === 'ArrowLeft')  goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
    });

    // ---------- Touch swipe (mobile) ----------
    // Horizontal drags change slide; vertical drags fall through so the page
    // still scrolls down into the gallery.
    const SWIPE_MIN = 45;
    let touchX = 0, touchY = 0, tracking = false, swiped = false;

    carousel.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
      tracking = true;
      swiped = false;
    }, { passive: true });

    carousel.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;

      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;

      // Ignore taps and anything more vertical than horizontal
      if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy)) return;

      // Suppress the click this swipe would otherwise fire on the reel slide
      swiped = true;
      setTimeout(() => { swiped = false; }, 400);

      goTo(current + (dx < 0 ? 1 : -1));
    }, { passive: true });

    // ---------- Reel modal ----------
    // Self-hosted <video>, so the UI is entirely ours: no chrome to suppress
    // and real fullscreen available on every platform including iPhone.
    const reelVideo = document.getElementById('reelVideo');
    const reelBar   = document.getElementById('reelBar');
    const reelTrack = document.getElementById('reelTrack');
    const reelFill  = document.getElementById('reelFill');
    const reelTime  = document.getElementById('reelTime');
    const reelCatch = document.getElementById('reelClickCatch');
    const reelFs    = document.getElementById('reelFs');

    // ---------- Fullscreen ----------
    // Standard API on desktop/Android/iPad. iPhone Safari offers no element
    // fullscreen, but it DOES give native <video> webkitEnterFullscreen() —
    // which hands off to the system player and genuinely hides the browser
    // bars, the one thing the old CSS rotate-and-fill could never do.
    function fsElement() {
      return document.fullscreenElement || document.webkitFullscreenElement || null;
    }

    function enterFullscreen() {
      const req = reelVideo.requestFullscreen || reelVideo.webkitRequestFullscreen;
      if (req) {
        const p = req.call(reelVideo);
        if (p && p.catch) p.catch(() => iosFullscreen());
        return;
      }
      iosFullscreen();
    }

    function iosFullscreen() {
      if (typeof reelVideo.webkitEnterFullscreen === 'function') {
        // Needs loaded metadata; if it isn't ready yet, wait for it once.
        if (reelVideo.readyState >= 1) reelVideo.webkitEnterFullscreen();
        else reelVideo.addEventListener('loadedmetadata',
               () => reelVideo.webkitEnterFullscreen(), { once: true });
      }
    }

    function toggleFullscreen() {
      if (fsElement()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) exit.call(document);
        return;
      }
      enterFullscreen();
    }

    reelFs.addEventListener('click', (e) => {
      e.stopPropagation();   // don't let the click-catcher also toggle pause
      toggleFullscreen();
      resetCursorTimer();
    });

    let cursorTimer;
    const BAR_HIDE_MS = 1000;   // bar and cursor fade this long after any input

    function resetCursorTimer() {
      modal.style.cursor = '';
      reelBar.classList.remove('idle');
      clearTimeout(cursorTimer);
      cursorTimer = setTimeout(() => {
        modal.style.cursor = 'none';
        reelBar.classList.add('idle');
      }, BAR_HIDE_MS);
    }

    // ---------- Custom scrub bar ----------
    function fmt(s) {
      s = Math.max(0, Math.floor(s || 0));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function paint(t, d) {
      reelFill.style.width = d ? `${(t / d) * 100}%` : '0';
      reelTime.textContent = `${fmt(t)} / ${fmt(d)}`;
    }

    let reelTick = null;
    let scrubbing = false;

    function startReelTick() {
      if (reelTick) return;
      reelTick = setInterval(() => {
        if (scrubbing) return;
        const d = reelVideo.duration || 0;
        if (!d || !isFinite(d)) return;
        paint(reelVideo.currentTime || 0, d);
      }, 200);
    }

    function stopReelTick() {
      clearInterval(reelTick);
      reelTick = null;
    }

    // Native end-of-video needs no special handling — there is no end screen
    // to pre-empt. Just rewind and park on the first frame.
    reelVideo.addEventListener('ended', () => {
      reelVideo.currentTime = 0;
      paint(0, reelVideo.duration || 0);
    });

    reelVideo.addEventListener('loadedmetadata', () => {
      paint(reelVideo.currentTime || 0, reelVideo.duration || 0);
    });

    function seekFromPointer(e) {
      const d = reelVideo.duration || 0;
      if (!d || !isFinite(d)) return;
      const r = reelTrack.getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      reelVideo.currentTime = frac * d;
      paint(frac * d, d);
    }

    reelTrack.addEventListener('pointerdown', (e) => {
      scrubbing = true;
      if (reelTrack.setPointerCapture) reelTrack.setPointerCapture(e.pointerId);
      seekFromPointer(e);
      resetCursorTimer();
    });
    reelTrack.addEventListener('pointermove', (e) => { if (scrubbing) seekFromPointer(e); });
    reelTrack.addEventListener('pointerup',     () => { scrubbing = false; });
    reelTrack.addEventListener('pointercancel', () => { scrubbing = false; });

    // Click/tap the picture to pause or resume
    reelCatch.addEventListener('click', () => {
      if (reelVideo.paused) reelVideo.play().catch(() => {});
      else                  reelVideo.pause();
      resetCursorTimer();
    });

    modal.addEventListener('touchstart', () => {
      if (modal.classList.contains('open')) resetCursorTimer();
    }, { passive: true });

    function openReel() {
      if (swiped) return;
      modal.classList.add('open');
      document.documentElement.classList.add('modal-open');
      document.body.classList.add('modal-open');
      // play() fires synchronously inside the tap handler so the user gesture
      // still counts — that is what avoids a second tap on iOS.
      reelVideo.play().catch(() => {});
      startReelTick();
      resetCursorTimer();
    }

    slideReel.addEventListener('click', openReel);
    slideReel.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openReel(); }
    });

    modal.addEventListener('mousemove', () => {
      if (modal.classList.contains('open')) resetCursorTimer();
    });

    function closeModal() {
      stopReelTick();
      scrubbing = false;
      // Leave fullscreen with the modal, by either route
      if (fsElement()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (exit) try { exit.call(document); } catch (_) {}
      }
      reelVideo.pause();
      reelVideo.currentTime = 0;
      paint(0, reelVideo.duration || 0);
      modal.classList.remove('open');
      document.documentElement.classList.remove('modal-open');
      document.body.classList.remove('modal-open');
      modal.style.cursor = '';
      clearTimeout(cursorTimer);
    }

    modalClose.addEventListener('click', closeModal);

    // ---------- Background hero video ----------
    // Self-hosted, so there is no reveal timing, no chrome suppression and no
    // manual looping to manage — the element's own autoplay/loop/poster handle
    // it. Safari on iOS occasionally declines autoplay on a freshly-inserted
    // element even when muted; retry once on first interaction, and if it never
    // plays the poster frame simply stays, which looks intentional.
    const eraVideo = document.getElementById('eraVideo');

    function nudgeEraVideo() {
      if (eraVideo && eraVideo.paused) {
        const p = eraVideo.play();
        if (p && p.catch) p.catch(() => { /* poster stays; acceptable */ });
      }
    }

    nudgeEraVideo();
    document.addEventListener('touchstart', nudgeEraVideo, { once: true, passive: true });
    document.addEventListener('click',      nudgeEraVideo, { once: true });

    // The YouTube IFrame API is gone entirely — both videos are now native
    // elements, so the page loads no third-party player script at all.
    reelVideo.addEventListener('play',  startReelTick);
    reelVideo.addEventListener('pause', stopReelTick);

    // ---------- Scroll hint ----------
    // Visible at top, hides when scrolled down, returns when back
    const scrollHint = document.getElementById('scrollHint');
    setTimeout(() => scrollHint.classList.add('visible'), 800);
    window.addEventListener('scroll', () => {
      scrollHint.classList.toggle('visible', window.scrollY < 50);
    });

  })();
  </script>
