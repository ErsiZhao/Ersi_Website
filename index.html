    :root {
      --aspect-ratio: 1;

      --visible-image-height: 500px;

    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;

      /* menu.css gives every page a fixed, cover-sized photo background. On this
         page it is completely hidden behind the carousel and the gallery, but it
         still downloads and — because it is background-attachment: fixed — forces
         a full-viewport repaint on every scroll frame, which is what makes
         scrolling stutter on desktop. Cancel it here only; other pages keep it. */
      background-image: none;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
        /*opacity and transition are fix BG image loading before the reel page*/

        transition: opacity 0.4s ease;

    .gallery-item {
      position: relative;
      width: 100vw;
      max-width: 100%;
      height: var(--visible-image-height);
      overflow: hidden;
    }

    .gallery-item img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.05s linear;
      will-change: transform;
      pointer-events: none;
    }

    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      background-color: rgba(var(--overlay-bg-color), var(--overlay-opacity));

      border-radius: 10px;

      font-size: var(--title-font-size);
    }

    .overlay p {
      font-size: var(--description-font-size);
    }

    .overlay a {
      display: inline-block;
      padding: 0.5rem 1rem;
      background-color: var(--button-color);
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-size: 1rem;
    }

    /* Responsive tweak for vertical screens */
    @media (max-aspect-ratio: 3/4) {
      :root {
        --image-height: 75vh;
        --aspect-ratio: 0.6;
        --title-font-size: 2.2rem;
        --description-font-size: 1.2rem;
      }
    }

    /* prevent scrolling while menu or reel modal is visible */
    html.menu-open, body.menu-open,
    html.modal-open, body.modal-open { overflow: hidden; }

    .carousel {

    .slide-caption {

  /* Slide order: 0 Eras Tour · 1 Reel · 2 NF Clouds · 3 Spotify */

  /* Poster sits under the iframe so first paint is instant and we never
     show YouTube's own play button while the player is still spinning up. */
  .slide-era     { background: #000 url('images/era_tour_poster.jpg') center/cover no-repeat; }
  .slide-reel    { background: url('images/landing_hero.jpg') center/cover no-repeat; cursor: pointer; }
  .slide-clouds  { background: url('images/7_clouds.png') center/cover no-repeat; }
  .slide-spotify { background: url('images/4_spotify_v03.png') center/cover no-repeat; }

  .slide-video {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: max(100vw, 177.78vh);
    height: max(100vh, 56.25vw);
    border: none;
    pointer-events: none;

    /* Revealed by JS only once the player reports PLAYING, so the
       poster covers YouTube's play overlay entirely. */
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .slide-video.playing { opacity: 1; }

  /* Opaque poster sitting ON TOP of the iframe. YouTube's chrome is inside a
     cross-origin frame we cannot style, so the only guaranteed way to keep it
     off screen is to physically cover it with our own element until playback
     is confirmed. Sits above the iframe, below the caption (z-index 10). */
  .era-cover {
    position: absolute;
    inset: 0;
    background: #000 url('images/era_tour_poster.jpg') center/cover no-repeat;
    z-index: 5;
    pointer-events: none;
    transition: opacity 0.6s ease;
  }

  .era-cover.lifted { opacity: 0; }

  /* Same bleed trick as the reel, so the Eras Tour background never flashes
     YouTube's title/Share strip either. The slide already clips overflow. */
  .slide-video iframe {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 100%;
    height: calc(100% + 2 * 90px);
    border: none;
    display: block;
  }


  /* ── Arrows ── */
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: white;
    font-size: 4rem;
    cursor: pointer;
    z-index: 500;
    padding: 1rem 1.5rem;
    opacity: 0.55;
    transition: opacity 0.2s, transform 0.2s;
    user-select: none;
    line-height: 1;
  }

  .arrow:hover { opacity: 1; transform: translateY(-50%) scale(1.15); }
  .arrow-left  { left: 1rem; }
  .arrow-right { right: 1rem; }
  .arrow.hidden { visibility: hidden; pointer-events: none; }

  /* On phones/tablets the slides are driven by swipe instead */
  @media (hover: none) and (pointer: coarse) {
    .arrow { display: none; }
  }

  /* ── Dots ── */
  .dots {
    position: absolute;
    bottom: 3.8rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 0.6rem;
    z-index: 500;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transition: background 0.3s;
    cursor: pointer;
  }

  .dot.active { background: rgba(255,255,255,0.9); }

  /* Keep the visual dot small but give it a finger-sized tap target */
  @media (hover: none) and (pointer: coarse) {
    .dots { gap: 0; }
    .dot {
      box-sizing: content-box;
      padding: 14px 10px;
      background-clip: content-box;
    }
  }



  /* ── Video modal ── */
  #videoModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.96);
    z-index: 3000;
  }

  #videoModal.open { display: block; }

  /* YouTube draws the title, channel, Share and Watch-later strip anchored to
     the top edge of the player for the first few seconds of playback, and no
     embed parameter disables it. So we make the iframe taller than the 16:9
     window by --yt-bleed top and bottom. The video letterboxes to the full
     width either way, so those extra bands are black bars — the overlay lands
     on the top band, and the wrapper's overflow clips it off. The picture
     itself is never cropped. */
  #reelVideoWrap {
    --yt-bleed: 90px;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    overflow: hidden;
  }

  #reelVideoWrap iframe {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 100%;
    height: calc(100% + 2 * var(--yt-bleed));
    border: none;
    display: block;
  }

  #modalClose {
    position: absolute;
    /* Safe-area inset keeps this clear of the iPhone notch / status bar */
    top: calc(env(safe-area-inset-top, 0px) + 1rem);
    right: calc(env(safe-area-inset-right, 0px) + 1rem);
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: rgba(0,0,0,0.35);
    border: none;
    color: white;
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
    z-index: 3003;   /* above the click-catcher (3001) and scrub bar (3002) */
    opacity: 0.75;
    transition: opacity 0.2s;
    -webkit-tap-highlight-color: transparent;
  }

  #modalClose:hover { opacity: 1; }

  /* ── Custom reel controls ──
     YouTube's control bar cannot be partially hidden — controls:1 brings the
     logo, title, share and settings with it, controls:0 removes everything.
     So the player runs bare and we draw just the scrub bar ourselves. */

  /* Keep clicks off the iframe; with controls:0 YouTube would still toggle
     playback on click and fight our own handler. */
  #reelVideoWrap { pointer-events: none; }

  #reelClickCatch {
    position: absolute;
    inset: 0;
    z-index: 3001;
    /* No cursor of its own on purpose: cursor is inherited, so an explicit
       value here would defeat the modal's cursor: none auto-hide. */
  }

  .reel-bar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 3002;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 20px calc(env(safe-area-inset-right, 0px) + 20px)
             calc(env(safe-area-inset-bottom, 0px) + 16px)
             calc(env(safe-area-inset-left, 0px) + 20px);
    background: linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0));
    transition: opacity 0.3s ease;
  }

  /* Fades out with the cursor, returns on any move or tap */
  .reel-bar.idle { opacity: 0; pointer-events: none; }

  .reel-track {
    position: relative;
    flex: 1;
    height: 34px;          /* generous hit area; the rail itself stays thin */
    cursor: pointer;
    touch-action: none;
  }

  .reel-rail, .reel-fill {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 4px;
    border-radius: 2px;
  }

  .reel-rail {
    left: 0;
    right: 0;
    background: rgba(255,255,255,0.28);
  }

  .reel-fill {
    left: 0;
    width: 0;
    background: rgba(199,158,53,0.95);   /* site accent */
  }

  .reel-fill::after {
    content: '';
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .reel-time {
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  @media (max-width: 600px) {
    .reel-time { font-size: 11px; }
    .reel-bar  { gap: 10px; }
  }

  /* iPhone hands playback to Apple's fullscreen player, which brings its own
     scrubber — so ours would be redundant. Pointer events go back to the
     iframe there, so YouTube's own play button stays tappable if iOS ever
     refuses our programmatic play. */
  #videoModal.native-fs .reel-bar,
  #videoModal.native-fs #reelClickCatch { display: none; }
  #videoModal.native-fs #reelVideoWrap  { pointer-events: auto; }



   /* ── Scroll hint ── */
  .scroll-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }

  .scroll-hint.visible { opacity: 1; }

  .scroll-hint span {
    color: rgba(255,255,255,0.6);
    font-size: 0.5rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    font-family: Arial, sans-serif;
  }

  .scroll-hint svg {
    animation: scrollBounce 1.4s ease-in-out infinite;
  }

  @keyframes scrollBounce {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(6px); }
  }

  /* Play icon for the demo reel — centred now that the "Reel" title is gone */
  .play-icon {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 5rem;
    height: 5rem;
    opacity: 0.8;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 10;
  }

  .slide-reel:hover .play-icon {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1.1);
  }
  </style>

  <script>
    // ---------- readiness gate ----------
    let galleryReadyResolve;
    const galleryReady = new Promise((resolve) => (galleryReadyResolve = resolve));

    // ---------- Build gallery from JSON ----------
    fetch('projects.json')
      .then(r => r.json())
      .then(async (data) => {
        const gallery = document.getElementById('gallery');

        data.forEach((project) => {
          const item = document.createElement('div');
          item.className = 'gallery-item';

          const img = document.createElement('img');
          img.src = project.image;
          img.alt = project.title;
          img.dataset.offset = project.offset || 0;

          const overlay = document.createElement('div');
          overlay.className = 'overlay';
          overlay.innerHTML = `
            <h2>${project.title}</h2>
            <p style="margin: 0.5rem 0 1rem 0; font-size: var(--description-font-size); color: #ccc;">
              ${project.description || ''}
            </p>
            <a href="${project.youtube}" target="_blank" rel="noopener noreferrer">${project.buttonText}</a>
          `;
          item.appendChild(img);
          item.appendChild(overlay);
          gallery.appendChild(item);
        });

        // Wait until images are decodable/paintable
        const imgs = [...document.querySelectorAll('.gallery-item img')];
        await Promise.all(
          imgs.map((img) =>
            (img.decode ? img.decode() : Promise.resolve()).catch(() => {
              return new Promise((res) => {
                if (img.complete) return res();
                img.addEventListener('load', res, { once: true });
                img.addEventListener('error', res, { once: true });
              });
            })
          )
        );


        updateLayoutSizes();
        applyParallax();
        // That way the gallery is invisible during the load/decode phase and fades in cleanly once everything is sized correctly.
        document.getElementById('gallery').style.opacity = '1';  // ← add this line




        galleryReadyResolve();
      })
      .catch(err => {
        console.error('Failed to load projects.json', err);
        galleryReadyResolve();
      });





    // ---------- Parallax ----------
    let ticking = false;
    const parallaxFactor = 0.2;

    function applyParallax() {
      const images = document.querySelectorAll('.gallery-item img');
      const windowHeight = window.innerHeight;

      images.forEach((img) => {
        const item = img.closest('.gallery-item');
        const rect = item.getBoundingClientRect();
        const center = rect.top + rect.height / 2 - windowHeight / 2;
        const offset = parseFloat(img.dataset.offset || 0);
        img.style.transform = `translate(-50%, calc(-50% + ${offset + center * -parallaxFactor}px))`;
      });

      ticking = false;
    }
    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(applyParallax);
        ticking = true;
      }
    });





    // ---------- Responsive sizing ----------
    function updateLayoutSizes() {
      const aspect = window.innerWidth / window.innerHeight;

      const baseTitle = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--base-title-size'));
      const baseDesc  = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--base-description-size'));
      const fontScale = aspect / 1.7;

      document.documentElement.style.setProperty('--title-font-size', `${baseTitle * fontScale}rem`);
      document.documentElement.style.setProperty('--description-font-size', `${baseDesc * fontScale}rem`);

      const baseVisibleHeight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--base-visible-height'));
      const heightScale = aspect / 1.7;
      document.documentElement.style.setProperty('--visible-image-height', `${baseVisibleHeight * heightScale}px`);
    }

    window.addEventListener('resize', () => {
      updateLayoutSizes();
      applyParallax();
    });
    window.addEventListener('load', () => {
      updateLayoutSizes();
      applyParallax();
    });

 // ---------- Carousel + Reel modal ----------
  // Both videos run through the YouTube IFrame Player API rather than a plain
  // <iframe src>. Two reasons, both iOS:
  //   1. playsinline stops Safari handing playback off to the YouTube app.
  //   2. A pre-built player lets us call playVideo() inside the tap handler,
  //      so the gesture still counts and iOS doesn't demand a second tap.
  (() => {
    const carousel   = document.getElementById('carousel');
    const wrapper    = document.getElementById('slidesWrapper');
    const btnLeft    = document.getElementById('arrowLeft');
    const btnRight   = document.getElementById('arrowRight');
    const dotsEl     = document.getElementById('dots');
    const slideReel  = document.getElementById('slideReel');
    const eraWrap    = document.getElementById('eraVideoWrap');
    const eraCover   = document.getElementById('eraCover');
    const modal      = document.getElementById('videoModal');
    const modalClose = document.getElementById('modalClose');

    const ERA_ID  = 'Wb7lNjQLUk8';
    const REEL_ID = 'KzvXRyeoXCU';
    const TOTAL   = 4;

    let current = 0;
    let eraPlayer = null;
    let reelPlayer = null;

    // ---------- Slide navigation ----------
    for (let i = 0; i < TOTAL; i++) {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    }

    function goTo(n) {
      if (n < 0 || n >= TOTAL) return;
      current = n;
      wrapper.style.transform = `translateX(-${current * 100}vw)`;
      btnLeft.classList.toggle('hidden', current === 0);
      btnRight.classList.toggle('hidden', current === TOTAL - 1);
      document.querySelectorAll('.dot').forEach((d, i) =>
        d.classList.toggle('active', i === current)
      );

      // Deliberately NOT pausing the background video when you swipe away.
      // A paused YouTube player draws its centre play button, so pausing on
      // leave means that button is sitting there waiting the moment you swipe
      // back. It is muted and loops, so letting it run is both simpler and the
      // only way to guarantee the slide is never re-entered showing chrome.
    }

    btnLeft.addEventListener('click',  () => goTo(current - 1));
    btnRight.addEventListener('click', () => goTo(current + 1));

    document.addEventListener('keydown', (e) => {
      if (modal.classList.contains('open')) {
        if (e.key === 'Escape') closeModal();
        if (e.key === ' ' && reelPlayer) {
          e.preventDefault();
          try {
            const st = reelPlayer.getPlayerState();
            if (st === YT.PlayerState.PLAYING) reelPlayer.pauseVideo();
            else reelPlayer.playVideo();
          } catch (_) { /* player not ready */ }
          resetCursorTimer();
        }
        return;
      }
      if (e.key === 'ArrowLeft')  goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
    });

    // ---------- Touch swipe (mobile) ----------
    // Horizontal drags change slide; vertical drags fall through so the page
    // still scrolls down into the gallery.
    const SWIPE_MIN = 45;
    let touchX = 0, touchY = 0, tracking = false, swiped = false;

    carousel.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) return;
      touchX = e.touches[0].clientX;
      touchY = e.touches[0].clientY;
      tracking = true;
      swiped = false;
    }, { passive: true });

    carousel.addEventListener('touchend', (e) => {
      if (!tracking) return;
      tracking = false;

      const dx = e.changedTouches[0].clientX - touchX;
      const dy = e.changedTouches[0].clientY - touchY;

      // Ignore taps and anything more vertical than horizontal
      if (Math.abs(dx) < SWIPE_MIN || Math.abs(dx) < Math.abs(dy)) return;

      // Suppress the click this swipe would otherwise fire on the reel slide
      swiped = true;
      setTimeout(() => { swiped = false; }, 400);

      goTo(current + (dx < 0 ? 1 : -1));
    }, { passive: true });

    // ---------- Reel modal ----------
    // iPhone gets Apple's native fullscreen player (one scrubber, nothing else).
    // Everywhere else the player runs bare and we draw the scrub bar ourselves,
    // because YouTube's control bar cannot be partially suppressed.
    const IS_IPHONE = /iPhone|iPod/.test(navigator.userAgent);

    const reelBar   = document.getElementById('reelBar');
    const reelTrack = document.getElementById('reelTrack');
    const reelFill  = document.getElementById('reelFill');
    const reelTime  = document.getElementById('reelTime');
    const reelCatch = document.getElementById('reelClickCatch');

    if (IS_IPHONE) modal.classList.add('native-fs');

    let cursorTimer;
    const BAR_HIDE_MS = 1000;   // bar and cursor fade this long after any input

    function resetCursorTimer() {
      modal.style.cursor = '';
      reelBar.classList.remove('idle');
      clearTimeout(cursorTimer);
      cursorTimer = setTimeout(() => {
        modal.style.cursor = 'none';
        reelBar.classList.add('idle');
      }, BAR_HIDE_MS);
    }

    // ---------- Custom scrub bar ----------
    function fmt(s) {
      s = Math.max(0, Math.floor(s || 0));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    }

    function paint(t, d) {
      reelFill.style.width = d ? `${(t / d) * 100}%` : '0';
      reelTime.textContent = `${fmt(t)} / ${fmt(d)}`;
    }

    let reelTick = null;
    let scrubbing = false;

    function startReelTick() {
      if (reelTick || IS_IPHONE) return;
      reelTick = setInterval(() => {
        if (!reelPlayer || scrubbing) return;
        let t = 0, d = 0;
        try {
          t = reelPlayer.getCurrentTime() || 0;
          d = reelPlayer.getDuration() || 0;
        } catch (_) { return; }
        if (d <= 0) return;

        // Stop just shy of the end so YouTube never paints its end screen
        // (replay button plus suggested videos) over the last frame.
        if (t >= d - 0.4) {
          reelPlayer.pauseVideo();
          reelPlayer.seekTo(0, true);
          paint(0, d);
          return;
        }
        paint(t, d);
      }, 200);
    }

    function stopReelTick() {
      clearInterval(reelTick);
      reelTick = null;
    }

    function seekFromPointer(e) {
      if (!reelPlayer) return;
      const r = reelTrack.getBoundingClientRect();
      const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      let d = 0;
      try { d = reelPlayer.getDuration() || 0; } catch (_) { return; }
      if (!d) return;
      reelPlayer.seekTo(frac * d, true);
      paint(frac * d, d);
    }

    reelTrack.addEventListener('pointerdown', (e) => {
      scrubbing = true;
      if (reelTrack.setPointerCapture) reelTrack.setPointerCapture(e.pointerId);
      seekFromPointer(e);
      resetCursorTimer();
    });
    reelTrack.addEventListener('pointermove', (e) => { if (scrubbing) seekFromPointer(e); });
    reelTrack.addEventListener('pointerup',     () => { scrubbing = false; });
    reelTrack.addEventListener('pointercancel', () => { scrubbing = false; });

    // Click/tap the picture to pause or resume
    reelCatch.addEventListener('click', () => {
      if (!reelPlayer) return;
      try {
        const st = reelPlayer.getPlayerState();
        if (st === YT.PlayerState.PLAYING) reelPlayer.pauseVideo();
        else reelPlayer.playVideo();
      } catch (_) { /* player not ready */ }
      resetCursorTimer();
    });

    modal.addEventListener('touchstart', () => {
      if (modal.classList.contains('open')) resetCursorTimer();
    }, { passive: true });

    function openReel() {
      if (swiped) return;
      modal.classList.add('open');
      document.documentElement.classList.add('modal-open');
      document.body.classList.add('modal-open');
      // playVideo() fires synchronously inside the tap handler so the user
      // gesture still counts — that is what avoids a second tap on iOS.
      if (reelPlayer) reelPlayer.playVideo();
      startReelTick();
      resetCursorTimer();
    }

    slideReel.addEventListener('click', openReel);
    slideReel.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openReel(); }
    });

    modal.addEventListener('mousemove', () => {
      if (modal.classList.contains('open')) resetCursorTimer();
    });

    function closeModal() {
      stopReelTick();
      scrubbing = false;
      if (reelPlayer) {
        reelPlayer.pauseVideo();
        reelPlayer.seekTo(0, true);
      }
      paint(0, 0);
      modal.classList.remove('open');
      document.documentElement.classList.remove('modal-open');
      document.body.classList.remove('modal-open');
      modal.style.cursor = '';
      clearTimeout(cursorTimer);
    }

    modalClose.addEventListener('click', closeModal);

    // ---------- YouTube IFrame API ----------

    // YouTube reports PLAYING the instant playback starts, but keeps animating
    // its own play-button overlay away for a few hundred ms afterwards. Revealing
    // on that event alone therefore still flashes the button. Gate the reveal on
    // the playback clock actually having advanced instead — by then the overlay
    // is genuinely gone. If playback never advances (autoplay blocked, Low Power
    // Mode), we simply stay on the poster, which is the better fallback anyway.
    // Seconds of genuinely-advanced playback before we lift the poster.
    // YouTube's centre play-button overlay outlives its own PLAYING event, and
    // measured against the real player it is still fading at 0.8s — so this is
    // deliberately generous. The cover is an opaque still of the same shot, so
    // holding it longer costs nothing visually; lifting it early shows chrome.
    const REVEAL_AFTER = 2.0;
    let revealPoll = null;
    let eraRevealed = false;

    function revealEra() {
      eraRevealed = true;
      eraWrap.classList.add('playing');
      eraCover.classList.add('lifted');
    }

    // Loop pre-emptively. Letting the video actually reach its end means YouTube
    // paints its end screen — replay button and suggested videos — for a beat
    // before our seek lands, which shows a play button on every single loop.
    // Jumping back slightly early means the ENDED state is never entered.
    const LOOP_BACK_BEFORE = 0.6;   // seconds before the end
    let loopWatch = null;

    function watchEraLoop(player) {
      if (loopWatch) return;
      loopWatch = setInterval(() => {
        let d = 0, t = 0;
        try {
          d = player.getDuration() || 0;
          t = player.getCurrentTime() || 0;
        } catch (_) { return; }
        if (d > 1 && t >= d - LOOP_BACK_BEFORE) player.seekTo(0, true);
      }, 250);
    }

    function revealEraWhenRunning(player) {
      if (revealPoll || eraRevealed) return;
      let waited = 0;
      revealPoll = setInterval(() => {
        let t = 0;
        try { t = player.getCurrentTime() || 0; } catch (_) { /* not ready yet */ }
        waited += 100;
        if (t >= REVEAL_AFTER) {
          clearInterval(revealPoll);
          revealPoll = null;
          revealEra();
        } else if (waited > 15000) {
          clearInterval(revealPoll);
          revealPoll = null;   // give up quietly; poster stays
        }
      }, 100);
    }

    window.onYouTubeIframeAPIReady = () => {
      eraPlayer = new YT.Player('eraVideo', {
        videoId: ERA_ID,
        playerVars: {
          // No loop/playlist here on purpose. loop:1 needs a playlist param for a
          // single video, and playlist mode makes YouTube draw prev/next buttons
          // around the centre play button even with controls:0. We loop by hand
          // on ENDED instead, which keeps the player out of playlist mode.
          autoplay: 1, mute: 1, controls: 0,
          rel: 0, playsinline: 1, modestbranding: 1,
          disablekb: 1, fs: 0, iv_load_policy: 3
        },
        events: {
          onReady: (e) => { e.target.mute(); e.target.playVideo(); },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING) {
              revealEraWhenRunning(e.target);
              watchEraLoop(e.target);
            }
            // Backstop only — watchEraLoop should prevent ever reaching this.
            if (e.data === YT.PlayerState.ENDED) {
              // Manual loop — seek back rather than letting the player idle on
              // its end screen, which would show chrome again.
              e.target.seekTo(0, true);
              e.target.playVideo();
            }
          }
        }
      });

      reelPlayer = new YT.Player('reelVideo', {
        videoId: REEL_ID,
        playerVars: Object.assign({
          autoplay: 0, controls: 0, rel: 0,
          modestbranding: 1, iv_load_policy: 3
        // Leaving playsinline off on iPhone is what makes iOS take playback
        // into its own fullscreen player. Everywhere else we want it inline.
        }, IS_IPHONE ? {} : { playsinline: 1 }),
        events: {
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.PLAYING) startReelTick();
            if (e.data === YT.PlayerState.PAUSED)  stopReelTick();
          }
        }
      });
    };

    const api = document.createElement('script');
    api.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(api);

    // ---------- Scroll hint ----------
    // Visible at top, hides when scrolled down, returns when back
    const scrollHint = document.getElementById('scrollHint');
    setTimeout(() => scrollHint.classList.add('visible'), 800);
    window.addEventListener('scroll', () => {
      scrollHint.classList.toggle('visible', window.scrollY < 50);
    });

  })();
  </script>
